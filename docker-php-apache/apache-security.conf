# Endurecimiento de Apache para el API Hacienda. El prefijo zz- en la imagen
# hace que cargue después del security.conf de Debian, que lo pisaría.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# En la raíz web solo se sirven api.php e index.php. Lo demás (settings,
# plantillas, composer, vendor, la clave temporal del entrypoint) no se
# publica.
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

<FilesMatch "^(settings.*|cryptoKey\.json|composer\.(json|lock|phar))$">
    Require all denied
</FilesMatch>

<DirectoryMatch "^/var/www/html/(vendor|api)(/|$)">
    Require all denied
</DirectoryMatch>
