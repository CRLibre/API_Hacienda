[project]
name = "api-hacienda-compat"
version = "0.1.0"
description = "Python 3.14.3 compatibility layer for CRLibre API_Hacienda"
readme = "README.md"
requires-python = "==3.14.3"
dependencies = [
  "fastapi>=0.129.0,<1.0.0",
  "uvicorn[standard]>=0.40.0,<1.0.0",
  "pydantic>=2.12.5,<3.0.0",
  "pydantic-settings>=2.12.0,<3.0.0",
  "sqlalchemy>=2.0.46,<3.0.0",
  "alembic>=1.18.4,<2.0.0",
  "httpx>=0.28.1,<1.0.0",
  "python-multipart>=0.0.22,<1.0.0",
  "lxml>=6.0.2,<7.0.0",
  "signxml>=4.2.2,<5.0.0",
  "cryptography>=46.0.5,<47.0.0",
  "bcrypt>=5.0.0,<6.0.0",
  "pymysql>=1.1.2,<2.0.0",
  "qrcode>=8.2,<9.0.0",
  "pypng>=0.20220715.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.26.0,<1.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
