[project]
name = "api-hacienda-compat"
version = "0.1.0"
description = "Python 3.14.3 compatibility layer for CRLibre API_Hacienda"
readme = "README.md"
requires-python = "==3.14.3"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "alembic>=1.16.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "lxml>=5.3.0,<6.0.0",
  "signxml>=4.0.0,<5.0.0",
  "cryptography>=45.0.0,<46.0.0",
  "bcrypt>=4.3.0,<5.0.0",
  "pymysql>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.26.0,<1.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
