name: Python Migration Smoke

on:
  push:
    branches: [dev, master, v4.4]
  pull_request:
    branches: [dev, master, v4.4]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install python-api dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e migration/python-api

      - name: Compile service package
        run: |
          python -m compileall migration/python-api/python_api

      - name: Basic app import check
        run: |
          python - <<'PY'
          from python_api.main import app
          assert app is not None
          print("python-api import ok")
          PY
