version: "3.5"
services:
  php-apache:
    container_name: ${APP_CONTAINER_NAME:-crlibre-app}
    build:
      context: .
      dockerfile: ./docker-php-apache/Dockerfile
    ports:
      # Solo loopback: para exponerlo, ponga delante un proxy inverso con TLS.
      - 127.0.0.1:8080:80
    env_file:
      - ./docker-php-apache/php-apache.env
    environment:
      # Variables que lee www/settings.php
      DB_HOST: ${DB_HOST:-mariadb}
      DB_NAME: ${DB_NAME:-testdb}
      DB_USERNAME: ${DB_USER:-testuser}
      DB_PASSWORD: ${DB_PASSWORD:-testpassword}
      cryptoKey: ${CRYPTO_KEY:?definir CRYPTO_KEY en .env (openssl rand -base64 32)}
      core_install: /var/www/api/
      core_siteName: ${CORE_SITE_NAME:-API Hacienda}
      core_host: ${CORE_HOST:-localhost}
      # Sin esto la sesión vence al segundo: (time() - lastAccess) > false
      sessionLifetime: ${SESSION_LIFETIME:-1000}
      # Variables que lee docker-entrypoint.sh
      CRLIBRE_API_HACIENDA_DB_HOST: ${DB_HOST:-mariadb}
      CRLIBRE_API_HACIENDA_DB_NAME: ${DB_NAME:-testdb}
      CRLIBRE_API_HACIENDA_DB_USER: ${DB_USER:-testuser}
      CRLIBRE_API_HACIENDA_DB_PASSWORD: ${DB_PASSWORD:-testpassword}
    depends_on:
      - "mariadb"
    networks:
      - crlibrenet
    volumes:
      - ./www/settings.php:/var/www/html/settings.php
      # Fuera de la raíz web: los .p12, logs y errores no se sirven por HTTP.
      - ./api:/var/www/api
  mariadb:
    image: mariadb:10.11.4
    container_name: ${MARIADB_CONTAINER_NAME:-crlibre-mariadb}
    ports:
      - 127.0.0.1:4407:3306
    env_file:
      - ./docker-php-apache/php-apache.env
    volumes:
      - ./recursos/sql:/docker-entrypoint-initdb.d
      - ./mysql-data:/var/lib/mysql
    environment:
      TZ: "America/Costa_Rica"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpwd}
      MYSQL_USER: ${DB_USER:-testuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-testpassword}
      MYSQL_DATABASE: ${DB_NAME:-testdb}
    restart: always
    tty: true
    networks:
      - crlibrenet

networks:
  crlibrenet:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
