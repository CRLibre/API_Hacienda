version: "3.9"

services:
  python-api:
    container_name: ${APP_CONTAINER_NAME:-api-hacienda-py}
    build:
      context: ./migration/python-api
      dockerfile: Dockerfile
    ports:
      - "8080:8090"
    environment:
      API_HACIENDA_ENV: ${API_HACIENDA_ENV:-development}
      API_HACIENDA_LOG_LEVEL: ${API_HACIENDA_LOG_LEVEL:-INFO}
      API_HACIENDA_PHP_FALLBACK_URL: ""
      API_HACIENDA_DATABASE_URL: ${API_HACIENDA_DATABASE_URL:-mysql+pymysql://testuser:testpassword@mariadb:3306/testdb}
      API_HACIENDA_CRYPTO_KEY: ${API_HACIENDA_CRYPTO_KEY:-}
      API_HACIENDA_FILES_BASE_PATH: /app/runtime/files/
    depends_on:
      - mariadb
    volumes:
      - ./migration/python-api/runtime:/app/runtime
      - ./migration/python-api/resources:/app/resources:ro
    networks:
      - crlibrenet

  mariadb:
    image: mariadb:10.11.4
    container_name: ${MARIADB_CONTAINER_NAME:-crlibre-mariadb}
    ports:
      - "4407:3306"
    volumes:
      - ./recursos/sql:/docker-entrypoint-initdb.d
      - ./mysql-data:/var/lib/mysql
    environment:
      TZ: "America/Costa_Rica"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpwd}
      MYSQL_USER: ${DB_USER:-testuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-testpassword}
      MYSQL_DATABASE: ${DB_NAME:-testdb}
    restart: always
    tty: true
    networks:
      - crlibrenet

networks:
  crlibrenet:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
